name: Cron Job

on:
  schedule:
    - cron: '*/15 * * * *' # Run every 15 minutes
  workflow_dispatch: # Allow manual triggering

jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cron API
        run: |
          curl -X GET ${{ secrets.APP_URL }}/api/reminders/cron \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
